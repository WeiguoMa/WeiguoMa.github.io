# Setup
title: Weiguo Ma
description: Quantum physicist working on programmable quantum simulation, nonequilibrium many-body dynamics, tensor networks, and quantum software.
tagline: 事以密成，言以泄败
url: https://WeiguoMa.github.io
avatar: /assets/image/avatar.webp
permalink: pretty
cover_image: /assets/image/main_bg.webp

# Gems
plugins:
  - jekyll-gist
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate-v2

# Optimize Jekyll
exclude:
  - .editorconfig
  - .git
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE.md
  - README.md
  - scripts/
  - not-pure-poole.gemspec
  - vendor/

include:
  - _pages

# Optimize Jekyl SEO Tag
# twitter:
#   username: vszhub
#   card: summary
logo: /assets/image/avatar.webp
social:
  name: Weiguo Ma
  links:
    - https://github.com/WeiguoMa
    - https://scholar.google.com/citations?user=BgKQ2UAAAAAJ&hl=en
    - https://orcid.org/0009-0000-3639-2294
lang: en

sass:
  sass_dir: _sass
  style: :compressed

# Options

# Replace this value and uncomment to enable Google Analytics tracking
# google_analytics: UA-000000-0

# Replace this value and uncomment to enable Disqus
# disqus: xxxxxx

# Specify the author for blog posts
author:
  name: Weiguo Ma
  url: https://github.com/WeiguoMa/
  email: david.mawg@gmail.com


pagination:
  enabled: true
  per_page: 5
  title: ':title - page :num'
  trail:
    before: 1
    after: 1
